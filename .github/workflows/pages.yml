name: Publicar no GitHub Pages

on:
  push:
    branches: [main, claude/rotina-inteligente-prototype-hlbdhu]
    # Mudanças só no Painel de Investimentos, no app Android ou no README não
    # republicam o app Rotina (o painel tem o próprio workflow, investimentos.yml).
    paths-ignore:
      - "web-investimentos/**"
      - "android-investimentos/**"
      - ".github/workflows/investimentos.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Enviar o site para a branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
