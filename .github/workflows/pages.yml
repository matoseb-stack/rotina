name: Publicar no GitHub Pages

on:
  push:
    branches: [main, claude/rotina-inteligente-prototype-hlbdhu]
  # Republica a cada hora para o Painel de Investimentos trazer notícias novas da Folha.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-investimentos/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Gerar o Painel de Investimentos (Next.js, export estático)
        working-directory: web-investimentos
        run: |
          npm ci
          npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/investimentos
      - name: Colocar o painel em /investimentos
        run: cp -r web-investimentos/out dist/investimentos
      - name: Enviar o site para a branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
