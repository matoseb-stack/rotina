/* Os 4 marcadores de status de cada tópico */

/* Patentes navais (hierarquia simplificada da MB) — evoluem com XP */
const RANKS = [

  { xp: 50,    name: 'Marinheiro',              icon: 'fa-anchor',          motto: 'Primeiras milhas navegadas.' },

/* Regras de XP (exibidas no modal de patentes) */
const XP_RULES = { perStudyHour: 30, perAnswer: 2, perCorrect: 3, perEditalCheck: 4, perSimulado: 15 };

const DIFFICULTY = { 1: { label: 'Fácil', cls: 'bg-emerald-50 text-emerald-700' }, 2: { label: 'Médio', cls: 'bg-amber-50 text-amber-700' }, 3: { label: 'Difícil', cls: 'bg-rose-50 text-rose-700' } };

/* Banco de questões — nível Escola Naval.
   s: matéria | d: dificuldade (1-3) | a: índice da alternativa correta | exp: resolução */
const QUESTIONS = [
  // ---------------- MATEMÁTICA ----------------
  { id: 'mat01', s: 'mat', d: 2, q: 'Calcule o limite:  lim (x→0) sen(3x) / x.', opts: ['0', '1/3', '1', '3', 'O limite não existe'], a: 3,
    exp: '1) Multiplique e divida por 3: sen(3x)/x = 3 · sen(3x)/(3x).\n2) Fazendo u = 3x, quando x→0 temos u→0 e lim sen(u)/u = 1 (limite fundamental).\n3) Logo, o limite vale 3 · 1 = 3.' },
  { id: 'mat02', s: 'mat', d: 1, q: 'Seja f(x) = x³ · ln x, com x > 0. O valor de f\'(1) é:', opts: ['0', '1', '2', '3', 'e'], a: 1,
    exp: '1) Regra do produto: f\'(x) = 3x² · ln x + x³ · (1/x) = 3x² ln x + x².\n2) Em x = 1: ln 1 = 0, então f\'(1) = 0 + 1 = 1.' },
  { id: 'mat03', s: 'mat', d: 1, q: 'O valor da integral definida ∫₀¹ (2x + 1) dx é:', opts: ['1', '3/2', '2', '5/2', '3'], a: 2,
    exp: '1) Primitiva: ∫(2x + 1)dx = x² + x.\n2) Avaliando de 0 a 1: (1² + 1) − (0 + 0) = 2.' },
  { id: 'mat04', s: 'mat', d: 2, q: 'Sendo i a unidade imaginária, o número complexo (1 + i)⁸ é igual a:', opts: ['−16', '16', '16i', '−16i', '8'], a: 1,
    exp: '1) (1 + i)² = 1 + 2i + i² = 2i.\n2) (1 + i)⁸ = [(1 + i)²]⁴ = (2i)⁴ = 16 · i⁴.\n3) Como i⁴ = 1, o resultado é 16.' },
  { id: 'mat05', s: 'mat', d: 1, q: 'Quantos anagramas distintos podem ser formados com as letras da palavra NAVAL?', opts: ['120', '60', '30', '24', '20'], a: 1,
    exp: '1) NAVAL tem 5 letras, com a letra A repetida 2 vezes.\n2) Permutação com repetição: P = 5! / 2! = 120 / 2 = 60.' },
  { id: 'mat06', s: 'mat', d: 2, q: 'O valor real de x que satisfaz log₂ x + log₄ x = 6 é:', opts: ['4', '8', '16', '32', '64'], a: 2,
    exp: '1) Mudança de base: log₄ x = log₂ x / log₂ 4 = (1/2) log₂ x.\n2) Então log₂ x + (1/2) log₂ x = 6 ⇒ (3/2) log₂ x = 6 ⇒ log₂ x = 4.\n3) Portanto x = 2⁴ = 16.' },
  { id: 'mat07', s: 'mat', d: 1, q: 'A soma da série geométrica infinita 1 + 1/3 + 1/9 + 1/27 + … é:', opts: ['4/3', '3/2', '2', '5/3', '3'], a: 1,
    exp: '1) PG infinita com a₁ = 1 e razão q = 1/3 (|q| < 1, logo converge).\n2) S = a₁ / (1 − q) = 1 / (2/3) = 3/2.' },
  { id: 'mat08', s: 'mat', d: 1, q: 'Lançando-se dois dados honestos de seis faces, a probabilidade de a soma das faces ser 7 é:', opts: ['1/12', '1/9', '1/6', '5/36', '7/36'], a: 2,
    exp: '1) Espaço amostral: 6 × 6 = 36 resultados.\n2) Casos favoráveis: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) → 6 casos.\n3) P = 6/36 = 1/6.' },
  { id: 'mat09', s: 'mat', d: 3, q: 'Sejam r₁, r₂ e r₃ as raízes do polinômio p(x) = x³ − 6x² + 11x − 6. O valor de r₁² + r₂² + r₃² é:', opts: ['6', '11', '14', '36', '49'], a: 2,
    exp: '1) Relações de Girard: r₁ + r₂ + r₃ = 6 e r₁r₂ + r₁r₃ + r₂r₃ = 11.\n2) Identidade: Σr² = (Σr)² − 2·Σ(rᵢrⱼ) = 36 − 22 = 14.\n3) Conferência: as raízes são 1, 2 e 3 → 1 + 4 + 9 = 14.' },
  { id: 'mat10', s: 'mat', d: 2, q: 'A distância do ponto P(1, 2) à reta r: 3x + 4y − 1 = 0 é:', opts: ['1', '2', '5/2', '10', '11/5'], a: 1,
    exp: '1) Fórmula: d = |a·x₀ + b·y₀ + c| / √(a² + b²).\n2) d = |3·1 + 4·2 − 1| / √(9 + 16) = |10| / 5 = 2.' },
  { id: 'mat11', s: 'mat', d: 3, q: 'O valor de ∫₀^π x · sen x dx é:', opts: ['0', '1', '2', 'π', '2π'], a: 3,
    exp: '1) Integração por partes: u = x (du = dx) e dv = sen x dx (v = −cos x).\n2) ∫x sen x dx = −x cos x + ∫cos x dx = −x cos x + sen x.\n3) De 0 a π: [−π·cos π + sen π] − [0 + 0] = [−π·(−1) + 0] = π.' },
  { id: 'mat12', s: 'mat', d: 2, q: 'Seja A = [[2, 1], [3, 4]] uma matriz 2×2. O determinante da matriz 2A é:', opts: ['5', '10', '20', '40', '25'], a: 2,

/* =====================================================================
   2. PERSISTÊNCIA (localStorage robusto)
   - Testa disponibilidade (modo privado / bloqueio de cookies)
   - JSON corrompido → tenta a cópia de segurança (last-known-good)
   - Erro de cota → avisa o usuário
   - Dados carregados passam por sanitização contra o esquema padrão
   ===================================================================== */
const STORAGE_KEY = 'logicAcademy.escolaNaval.v1';
const BACKUP_KEY = STORAGE_KEY + '.backup';
const SCHEMA_VERSION = 1;

const Store = (() => {
  let available = false;
  try {
    const t = '__la_test__';
    window.localStorage.setItem(t, t);
    window.localStorage.removeItem(t);
    available = true;
  } catch (e) {
    console.warn('[Store] localStorage indisponível:', e);
  }

  function read(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return { ok: true, data: null };
      return { ok: true, data: JSON.parse(raw), raw };
    } catch (e) {
      console.error('[Store] Falha ao ler/parsear', key, e);
      return { ok: false, data: null };
    }
  }

  return {
    get available() { return available; },

    /** Carrega o estado; usa o backup se o principal estiver corrompido. */
    load() {
      if (!available) return { data: null, source: 'none' };
      const main = read(STORAGE_KEY);
      if (main.ok && main.data && typeof main.data === 'object') {
        // Guarda a última versão boa como backup
        try { localStorage.setItem(BACKUP_KEY, main.raw); } catch (_) { /* ignora */ }
        return { data: main.data, source: 'main' };
      }
      if (!main.ok) {
        // Preserva o conteúdo corrompido para diagnóstico em vez de descartá-lo
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) localStorage.setItem(STORAGE_KEY + '.corrupt', raw);
        } catch (_) { /* ignora */ }
      }
      const backup = read(BACKUP_KEY);
      if (backup.ok && backup.data && typeof backup.data === 'object') {
        return { data: backup.data, source: 'backup' };
      }
      return { data: null, source: main.ok ? 'empty' : 'corrupt' };
    },

    /** Salva o estado. Retorna true/false. */
    save(state) {
      if (!available) return false;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        return true;
      } catch (e) {
        console.error('[Store] Falha ao salvar:', e);
        const quota = e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014);
        toast(quota ? 'Armazenamento cheio: exporte um backup e limpe dados antigos.' : 'Não foi possível salvar os dados.', 'error');
        return false;
      }
    },

    clear() {
      if (!available) return;
      try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(BACKUP_KEY); } catch (_) { /* ignora */ }
    }
  };
})();

   3. ESTADO + UTILITÁRIOS

function defaultExamDate() {
  // Data estimada (editável): meados do próximo ano
  const y = new Date().getFullYear() + 1;
  return `${y}-06-20`;
}

function createDefaultState() {
  const plan = {};
  DAYS.forEach(d => { plan[d.k] = []; });
  return {
    version: SCHEMA_VERSION,
    createdAt: Date.now(),
    examDate: defaultExamDate(),
    settings: { sound: true, autoStart: false, dailyGoalMin: 240, durations: { focus: 25, short: 5, long: 15 } },
    studyLog: {},       // { 'AAAA-MM-DD': { total: seg, bySubject: { mat: seg, ... } } }
    edital: {},         // { 'mat.limites': { teoria, resumo, questoes, revisado } }
    questionStats: {},  // { qid: { attempts, correct, last, lastCorrect, ts } }
    simulados: [],      // [{ date, total, correct, subject, diff, durationSec }]
    plan,               // { seg: [{ id, subject, goal, minutes, done }], ... }
    timer: { mode: 'focus', running: false, endAt: null, remaining: 25 * 60, freeMs: 0, lastTick: null, subject: 'mat', cycles: 0 }
  };
}

const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const num = (v, def, min = -Infinity, max = Infinity) => (typeof v === 'number' && isFinite(v) ? Math.min(max, Math.max(min, v)) : def);

/** Valida e normaliza dados vindos do storage/backup. Nunca lança exceção. */
function sanitizeState(raw) {
  const d = createDefaultState();
  if (!isObj(raw)) return d;
  try {
    if (typeof raw.examDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(raw.examDate)) d.examDate = raw.examDate;
    if (typeof raw.createdAt === 'number') d.createdAt = raw.createdAt;

    if (isObj(raw.settings)) {
      const s = raw.settings;
      d.settings.sound = s.sound !== false;
      d.settings.autoStart = s.autoStart === true;
      d.settings.dailyGoalMin = num(s.dailyGoalMin, 240, 15, 960);
      if (isObj(s.durations)) {
        d.settings.durations.focus = num(s.durations.focus, 25, 1, 180);
        d.settings.durations.short = num(s.durations.short, 5, 1, 60);
        d.settings.durations.long = num(s.durations.long, 15, 1, 90);
      }
    }

    if (isObj(raw.studyLog)) {
      for (const [day, v] of Object.entries(raw.studyLog)) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || !isObj(v)) continue;
        const entry = { total: num(v.total, 0, 0), bySubject: {} };
        if (isObj(v.bySubject)) for (const k of SUBJECT_KEYS) if (v.bySubject[k]) entry.bySubject[k] = num(v.bySubject[k], 0, 0);
        d.studyLog[day] = entry;
      }
    }

    if (isObj(raw.edital)) {
      for (const [id, v] of Object.entries(raw.edital)) {
        if (!isObj(v)) continue;
        const e = {};
        STATUS_FIELDS.forEach(f => { e[f.key] = v[f.key] === true; });
        d.edital[id] = e;
      }
    }

    if (isObj(raw.questionStats)) {
      for (const [id, v] of Object.entries(raw.questionStats)) {
        if (!QUESTION_MAP[id] || !isObj(v)) continue;
        const attempts = num(v.attempts, 0, 0);
        d.questionStats[id] = {
          attempts, correct: num(v.correct, 0, 0, attempts),
          last: typeof v.last === 'number' ? v.last : null,
          lastCorrect: typeof v.lastCorrect === 'boolean' ? v.lastCorrect : null,
          ts: num(v.ts, 0)
        };
      }
    }

    if (Array.isArray(raw.simulados)) {
      d.simulados = raw.simulados.filter(isObj).slice(-200).map(s => ({
        date: num(s.date, Date.now()), total: num(s.total, 0, 0), correct: num(s.correct, 0, 0),
        subject: typeof s.subject === 'string' ? s.subject : 'all', diff: typeof s.diff === 'string' ? s.diff : 'all',
        durationSec: num(s.durationSec, 0, 0)
      }));
    }

    if (isObj(raw.plan)) {
      DAYS.forEach(({ k }) => {
        if (!Array.isArray(raw.plan[k])) return;
        d.plan[k] = raw.plan[k].filter(isObj).slice(0, 30).map(it => ({
          id: typeof it.id === 'string' ? it.id : uid(),
          subject: SUBJECTS[it.subject] ? it.subject : 'mat',
          goal: typeof it.goal === 'string' ? it.goal.slice(0, 140) : '',
          minutes: num(it.minutes, 60, 0, 720),
          done: it.done === true
        }));
      });
    }

    if (isObj(raw.timer)) {
      const t = raw.timer;
      d.timer.mode = TIMER_MODES[t.mode] ? t.mode : 'focus';
      d.timer.subject = SUBJECTS[t.subject] ? t.subject : 'mat';
      d.timer.cycles = num(t.cycles, 0, 0);
      d.timer.running = t.running === true;
      d.timer.endAt = typeof t.endAt === 'number' ? t.endAt : null;
      d.timer.remaining = num(t.remaining, d.settings.durations[d.timer.mode] * 60 || 0, 0);
      d.timer.freeMs = num(t.freeMs, 0, 0);
      d.timer.lastTick = typeof t.lastTick === 'number' ? t.lastTick : null;
      if (d.timer.running && d.timer.mode !== 'free' && !d.timer.endAt) d.timer.running = false;
    }
  } catch (e) {
    console.error('[sanitizeState] Erro inesperado, usando padrão parcial:', e);
  }
  return d;
}

let S;

let saveTimeout = null;
/** Salva imediatamente (consolidando o tempo de estudo pendente). */
function saveNow() {
  clearTimeout(saveTimeout);
  commitPendingStudy();
  Store.save(S);
}
/** Salva com debounce (para interações rápidas). */
function saveSoon() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveNow, 300);
}

/* ---------- Utilitários ---------- */
function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(d = new Date()) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseDateKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function todayDayKey() { return JS_DAY_TO_KEY[new Date().getDay()]; }
function fmtClock(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function fmtDuration(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h === 0) return `${m}min`;
  return m ? `${h}h ${pad(m)}min` : `${h}h`;
}
function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; }
function fmtDateLong(k) {
  try { return parseDateKey(k).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }); }
  catch (_) { return k; }
}
function subjectBadge(k, extra = '') {
  const s = SUBJECTS[k];
  return `<span class="chip ${extra}" style="background:${s.color}14;color:${s.color}"><i class="fa-solid ${s.icon}"></i>${s.name}</span>`;
}
function progressBar(p, color = '#071d41', h = '') {
  return `<div class="bar ${h}"><span style="width:${Math.min(100, Math.max(0, p))}%;background:${color}"></span></div>`;
}

/* =====================================================================
   4. GAMIFICAÇÃO / ESTATÍSTICAS
   ===================================================================== */

function addStudy(seconds, subject) {
  if (seconds <= 0) return;
  const k = dateKey();
  const e = S.studyLog[k] || (S.studyLog[k] = { total: 0, bySubject: {} });
  e.total += seconds;
  e.bySubject[subject] = (e.bySubject[subject] || 0) + seconds;
}

function totalStudySeconds() { return Object.values(S.studyLog).reduce((a, e) => a + (e.total || 0), 0); }
function todaySeconds() { return (S.studyLog[dateKey()] || { total: 0 }).total + Math.floor(pendingStudyMs / 1000); }

function studyBySubjectAll() {
  const out = {}; SUBJECT_KEYS.forEach(k => out[k] = 0);
  Object.values(S.studyLog).forEach(e => { for (const k in e.bySubject) if (k in out) out[k] += e.bySubject[k]; });
  return out;
}

function streakDays() {
  let streak = 0;
  const d = new Date();
  // Se hoje ainda não estudou, a sequência conta a partir de ontem
  if (!((S.studyLog[dateKey(d)] || {}).total >= 60)) d.setDate(d.getDate() - 1);
  while ((S.studyLog[dateKey(d)] || {}).total >= 60) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}

function questionTotals(filterFn = () => true) {
  let answered = 0, correct = 0, unique = 0;
  for (const [id, st] of Object.entries(S.questionStats)) {
    const q = QUESTION_MAP[id];
    if (!q || !filterFn(q)) continue;
    answered += st.attempts; correct += st.correct; if (st.attempts > 0) unique++;
  }
  return { answered, correct, unique, acc: pct(correct, answered) };
}

function editalProgress(subj) {
  const keys = subj ? [subj] : SUBJECT_KEYS;
  let done = 0, total = 0, topicsDone = 0, topics = 0;
  keys.forEach(k => {
    EDITAL[k].forEach(([slug]) => {
      const e = S.edital[`${k}.${slug}`];
      const c = e ? STATUS_FIELDS.filter(f => e[f.key]).length : 0;
      done += c; total += STATUS_FIELDS.length; topics++;
      if (c === STATUS_FIELDS.length) topicsDone++;
    });
  });
  return { done, total, pct: pct(done, total), topicsDone, topics };
}

function computeXP() {
  const hours = totalStudySeconds() / 3600;
  const q = questionTotals();
  const checks = editalProgress().done;
  return Math.floor(hours * XP_RULES.perStudyHour + q.answered * XP_RULES.perAnswer + q.correct * XP_RULES.perCorrect +
    checks * XP_RULES.perEditalCheck + S.simulados.length * XP_RULES.perSimulado);
}

function getRank(xp) {
  let idx = 0;
  RANKS.forEach((r, i) => { if (xp >= r.xp) idx = i; });
  const cur = RANKS[idx], next = RANKS[idx + 1] || null;
  const progress = next ? pct(xp - cur.xp, next.xp - cur.xp) : 100;
  return { idx, cur, next, progress, xp };
}

/* Detecta promoção para comemorar */
let lastRankIdx = getRank(computeXP()).idx;
function checkPromotion() {
  const r = getRank(computeXP());
  if (r.idx > lastRankIdx) {
    toast(`<i class="fa-solid ${r.cur.icon} mr-1"></i> Promoção! Agora você é <strong>${r.cur.name}</strong>.`, 'gold', 5000);
    Sound.play('promo');
  }
  lastRankIdx = r.idx;
}

function daysUntilExam() {
  const today = parseDateKey(dateKey());
  const exam = parseDateKey(S.examDate);
  return Math.round((exam - today) / 86400000);
}

/* =====================================================================
   5. CRONÔMETRO + SOM (Web Audio API)
   - Baseado em timestamps (preciso mesmo com a aba em segundo plano)
   - Estado persiste: ao recarregar, o ciclo continua de onde estava
   - Tempo de Foco e Livre é registrado automaticamente no dia
   ===================================================================== */

const Sound = (() => {
  let ctx = null;
  function getCtx() {
    try {
      if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { console.warn('[Sound]', e); return null; }
  }
  function beep(c, freq, start, dur, type = 'sine', vol = 0.25) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(vol, c.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
  }
  const PATTERNS = {
    // Fim do foco: toque de "sino de bordo" (pares de badaladas)
    focusEnd: c => { [0, 0.35, 1.0, 1.35].forEach(t => { beep(c, 880, t, 0.6, 'sine', 0.3); beep(c, 1320, t, 0.4, 'sine', 0.08); }); },
    // Fim da pausa: chamada ascendente
    breakEnd: c => { [523, 659, 784, 1047].forEach((f, i) => beep(c, f, i * 0.16, 0.3, 'triangle', 0.25)); },
    promo: c => { [523, 659, 784, 1047, 1319].forEach((f, i) => beep(c, f, i * 0.11, 0.35, 'triangle', 0.2)); },
    click: c => beep(c, 660, 0, 0.08, 'sine', 0.12)
  };
  return {
    unlock() { getCtx(); },
    play(name, force = false) {
      if (!S.settings.sound && !force) return;
      const c = getCtx(); if (!c || !PATTERNS[name]) return;
      try { PATTERNS[name](c); } catch (e) { console.warn('[Sound]', e); }
    }
  };
})();

let pendingStudyMs = 0;           // tempo estudado ainda não consolidado no log
const MAX_RESTORE_GAP = 3 * 3600e3; // limite de crédito ao reabrir com o livre rodando

function modeDuration(mode) { return (S.settings.durations[mode] || 0) * 60; }
function countsAsStudy(mode) { return mode === 'focus' || mode === 'free'; }

/** Consolida o tempo pendente no log do dia (sem salvar). */
function commitPendingStudy() {
  const secs = Math.floor(pendingStudyMs / 1000);
  if (secs > 0) {
    pendingStudyMs -= secs * 1000;
    addStudy(secs, S.timer.subject);
  }
}

/** Processa a passagem do tempo desde o último tick. */
function timerTick() {
  const t = S.timer;
  if (!t.running) return;
  const now = Date.now();
  let delta = Math.max(0, now - (t.lastTick || now));
  if (delta > MAX_RESTORE_GAP) delta = MAX_RESTORE_GAP;
  t.lastTick = now;

  if (t.mode === 'free') {
    t.freeMs += delta;
    pendingStudyMs += delta;
  } else {
    const remainingMs = t.endAt - now;
    if (t.mode === 'focus') {
      const overshoot = Math.max(0, -remainingMs); // não conta tempo além do fim do ciclo
      pendingStudyMs += Math.max(0, delta - overshoot);
    }
    t.remaining = Math.max(0, Math.ceil(remainingMs / 1000));
    if (remainingMs <= 0) { finishCycle(); return; }
  }
  if (pendingStudyMs >= 15000) saveNow(); // consolida a cada ~15 s
  updateTimerUI();
}

function timerStart() {
  const t = S.timer;
  if (t.running) return;
  Sound.unlock();
  const now = Date.now();
  if (t.mode !== 'free') {
    if (t.remaining <= 0) t.remaining = modeDuration(t.mode);
    t.endAt = now + t.remaining * 1000;
  }
  t.lastTick = now;
  t.running = true;
  saveNow();
  renderTimerControls();
}

function timerPause() {
  const t = S.timer;
  if (!t.running) return;
  timerTick();
  t.running = false;
  t.endAt = null;
  saveNow();
  checkPromotion();
  renderTimerControls();
}

function timerReset() {
  const t = S.timer;
  if (t.running) timerTick();
  t.running = false; t.endAt = null;
  if (t.mode === 'free') {
    const saved = Math.round(t.freeMs / 1000);
    t.freeMs = 0;
    if (saved >= 60) toast(`Sessão livre registrada: ${fmtDuration(saved)} de ${SUBJECTS[t.subject].name}.`, 'success');
  } else {
    t.remaining = modeDuration(t.mode);
  }
  saveNow();
  checkPromotion();
  render();
}

function setTimerMode(mode, silent = false) {
  const t = S.timer;
  if (t.running) timerTick();
  t.running = false; t.endAt = null;
  t.mode = mode;
  if (mode === 'free') t.freeMs = 0; else t.remaining = modeDuration(mode);
  saveNow();
  if (!silent) render();
}

function finishCycle() {
  const t = S.timer;
  const finished = t.mode;
  t.running = false; t.endAt = null; t.remaining = 0;
  saveNow();
  if (finished === 'focus') {
    t.cycles++;
    Sound.play('focusEnd');
    const next = t.cycles % 4 === 0 ? 'long' : 'short';
    toast(`<i class="fa-solid fa-bell mr-1"></i> Ciclo de foco concluído! Hora da ${TIMER_MODES[next].label.toLowerCase()}.`, 'gold', 6000);
    setTimerMode(next, true);
  } else {
    Sound.play('breakEnd');
    toast('<i class="fa-solid fa-anchor mr-1"></i> Pausa encerrada. De volta ao posto!', 'info', 6000);
    setTimerMode('focus', true);
  }
  checkPromotion();
  if (S.settings.autoStart) timerStart();
  render();
}

function timerSkip() {
  const t = S.timer;
  if (t.mode === 'free') return;
  if (t.running) timerTick();
  if (t.mode === 'focus') { t.cycles++; setTimerMode(t.cycles % 4 === 0 ? 'long' : 'short'); }
  else setTimerMode('focus');
}

function timerSetSubject(subj) {
  if (!SUBJECTS[subj]) return;
  if (S.timer.running) timerTick();
  commitPendingStudy(); // o tempo anterior fica com a matéria anterior
  S.timer.subject = subj;
  saveNow();
}

function timerDisplaySeconds() {
  const t = S.timer;
  return t.mode === 'free' ? Math.floor(t.freeMs / 1000) : t.remaining;
}

/* Atualiza apenas os elementos do cronômetro (sem re-render completo) */
function updateTimerUI() {
  const t = S.timer;
  const sec = timerDisplaySeconds();
  const display = document.getElementById('timer-display');
  if (display) display.textContent = fmtClock(sec);
  const ring = document.getElementById('timer-ring');
  if (ring) {
    const C = 2 * Math.PI * 118;
    let frac;
    if (t.mode === 'free') frac = (sec % 3600) / 3600;
    else { const total = modeDuration(t.mode) || 1; frac = sec / total; }
    ring.style.strokeDashoffset = String(C * (1 - frac));
  }
  const todayEl = document.getElementById('timer-today');
  if (todayEl) todayEl.textContent = fmtDuration(todaySeconds());

  // Pill no cabeçalho + título da aba
  const pill = document.getElementById('timer-pill');
  if (pill) {
    const show = t.running && currentView !== 'timer';
    pill.classList.toggle('hidden', !show);
    pill.classList.toggle('inline-flex', show);
    document.getElementById('timer-pill-text').textContent = `${TIMER_MODES[t.mode].label} · ${fmtClock(sec)}`;
  }
  document.title = t.running ? `${fmtClock(sec)} · ${TIMER_MODES[t.mode].label} — Logic Academy` : 'Logic Academy · Escola Naval';
}

function renderTimerControls() {
  const btn = document.getElementById('timer-toggle');
  if (btn) {
    const r = S.timer.running;
    btn.innerHTML = r ? '<i class="fa-solid fa-pause"></i> Pausar' : '<i class="fa-solid fa-play"></i> Iniciar';
    btn.className = r ? 'btn-ghost !px-8 !py-3.5 !text-base' : 'btn-gold !px-8 !py-3.5 !text-base';
  }
  updateTimerUI();
}

/* ---------------------- 6.4 QUESTÕES ---------------------- */
function buildQuestionList() {
  const { subject, diff, status } = QV.filters;
  QV.list = QUESTIONS.filter(q => {
    if (subject !== 'all' && q.s !== subject) return false;
    if (diff !== 'all' && String(q.d) !== diff) return false;
    const st = S.questionStats[q.id];
    if (status === 'new' && st && st.attempts > 0) return false;
    if (status === 'wrong' && !(st && st.lastCorrect === false)) return false;
    if (status === 'right' && !(st && st.lastCorrect === true)) return false;
    return true;
  }).map(q => q.id);
  QV.idx = 0; QV.selected = null; QV.revealed = false;
}

  const f = QV.filters;
  return `

        ${SUBJECT_KEYS.map(k => `<option value="${k}" ${f.subject === k ? 'selected' : ''}>${SUBJECTS[k].name} (${QUESTIONS.filter(q => q.s === k).length})</option>`).join('')}
      </select></div>
    <div><label class="label">Dificuldade</label>
      <select data-change="q-filter" data-key="diff" class="input">
        <option value="all">Todas</option>
        ${[1, 2, 3].map(d => `<option value="${d}" ${f.diff === String(d) ? 'selected' : ''}>${DIFFICULTY[d].label}</option>`).join('')}
      </select></div>
    ${includeStatus ? `<div><label class="label">Situação</label>
      <select data-change="q-filter" data-key="status" class="input">
        ${[['all', 'Todas'], ['new', 'Não respondidas'], ['wrong', 'Errei na última'], ['right', 'Acertei na última']].map(([v, l]) => `<option value="${v}" ${f.status === v ? 'selected' : ''}>${l}</option>`).join('')}
      </select></div>` : ''}
  </div>`;
}

function viewQuestoes() {
  const tabs = `
  <div class="mb-5 inline-flex rounded-xl bg-white p-1 shadow-soft border border-slate-200/70">
    <button data-action="q-mode" data-mode="treino" class="btn !py-2 ${QV.mode === 'treino' ? 'bg-navy-900 text-white' : 'text-slate-600'}"><i class="fa-solid fa-dumbbell"></i>Treino</button>
    <button data-action="q-mode" data-mode="simulado" class="btn !py-2 ${QV.mode === 'simulado' ? 'bg-navy-900 text-white' : 'text-slate-600'}"><i class="fa-solid fa-file-circle-check"></i>Simulado</button>
  </div>`;
  return tabs + (QV.mode === 'treino' ? viewTreino() : viewSimulado());
}

function alternativesHTML(q, selected, revealed, action) {
  return q.opts.map((opt, i) => {
    const letter = 'ABCDE'[i];
    let cls = 'border-slate-200 bg-white hover:border-navy-600 hover:bg-navy-50';
    let badge = 'bg-slate-100 text-slate-600';
    let icon = '';
    if (revealed) {
      if (i === q.a) { cls = 'border-emerald-500 bg-emerald-50'; badge = 'bg-emerald-500 text-white'; icon = '<i class="fa-solid fa-circle-check text-emerald-600"></i>'; }
      else if (i === selected) { cls = 'border-rose-500 bg-rose-50'; badge = 'bg-rose-500 text-white'; icon = '<i class="fa-solid fa-circle-xmark text-rose-600"></i>'; }
      else cls = 'border-slate-200 bg-white opacity-60';
    } else if (i === selected) { cls = 'border-navy-900 bg-navy-50 ring-2 ring-navy-100'; badge = 'bg-navy-900 text-white'; }
    return `
      <button data-action="${action}" data-opt="${i}" ${revealed ? 'disabled' : ''} class="flex w-full items-center gap-3 rounded-xl border-2 px-4 py-3 text-left text-sm transition ${cls} disabled:cursor-default">
        <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-sm font-bold ${badge}">${letter}</span>
        <span class="flex-1 text-slate-800">${esc(opt)}</span>${icon}
      </button>`;
  }).join('');
}

function questionHeader(q, extra = '') {
  return `
  <div class="flex flex-wrap items-center gap-2">
    ${subjectBadge(q.s)}
    <span class="chip ${DIFFICULTY[q.d].cls}"><i class="fa-solid fa-signal"></i>${DIFFICULTY[q.d].label}</span>
    <span class="chip bg-slate-100 text-slate-500">#${q.id.toUpperCase()}</span>
    ${extra}
  </div>`;
}

function viewTreino() {
  const list = QV.list;
  const q = QUESTION_MAP[list[QV.idx]];
  const totals = questionTotals();

  let body;
  if (!q) {
    body = `<div class="card card-pad text-center">
      <i class="fa-solid fa-magnifying-glass text-3xl text-slate-300"></i>
      <p class="mt-3 font-semibold text-navy-900">Nenhuma questão encontrada com esses filtros.</p>
      <p class="text-sm text-slate-500">Altere a matéria, a dificuldade ou a situação.</p></div>`;
  } else {
    const st = S.questionStats[q.id];
    const isCorrect = QV.revealed && QV.selected === q.a;
    body = `
    <section class="card card-pad">
      <div class="flex flex-wrap items-center justify-between gap-2">
        ${questionHeader(q)}
        <span class="text-sm font-semibold text-slate-500">Questão ${QV.idx + 1} de ${list.length}</span>
      </div>
      <p class="q-text mt-5 text-base leading-relaxed text-slate-800 sm:text-[17px]">${esc(q.q)}</p>
      <div class="mt-5 space-y-2.5">${alternativesHTML(q, QV.selected, QV.revealed, 'q-answer')}</div>

      ${QV.revealed ? `
      <div class="fade-in mt-5 rounded-xl border-l-4 p-4 ${isCorrect ? 'border-emerald-500 bg-emerald-50' : 'border-rose-500 bg-rose-50'}">
        <div class="font-semibold ${isCorrect ? 'text-emerald-800' : 'text-rose-800'}">
          <i class="fa-solid ${isCorrect ? 'fa-circle-check' : 'fa-circle-xmark'} mr-1"></i>
          ${isCorrect ? 'Correto! Bravo Zulu.' : `Incorreto. A resposta certa é a letra ${'ABCDE'[q.a]}.`}
        </div>
      </div>
      <div class="fade-in mt-3 rounded-xl bg-navy-50 p-4">
        <div class="text-xs font-bold uppercase tracking-wide text-navy-700"><i class="fa-solid fa-route mr-1"></i>Resolução passo a passo</div>
        <p class="q-text mt-2 text-sm leading-relaxed text-navy-900">${esc(q.exp)}</p>
      </div>` : ''}

      <div class="mt-5 flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 pt-4">
        <div class="text-xs text-slate-500">
          <i class="fa-solid fa-chart-simple mr-1"></i>
          ${st && st.attempts ? `Seu histórico: ${st.attempts} tentativa${st.attempts > 1 ? 's' : ''} · ${st.correct} acerto${st.correct === 1 ? '' : 's'} · ${pct(st.correct, st.attempts)}%` : 'Primeira tentativa nesta questão'}
        </div>
        <div class="flex gap-2">
          <button data-action="q-prev" class="btn-ghost" ${QV.idx === 0 ? 'disabled' : ''}><i class="fa-solid fa-arrow-left"></i></button>
          <button data-action="q-random" class="btn-ghost" title="Aleatória"><i class="fa-solid fa-shuffle"></i></button>
          ${QV.revealed ? '' : '<button data-action="q-skip" class="btn-ghost">Pular</button>'}
          <button data-action="q-next" class="btn-primary" ${QV.idx >= list.length - 1 ? 'disabled' : ''}>Próxima<i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>
    </section>`;
  }

  // Ranking das mais erradas
  const hardest = Object.entries(S.questionStats)
    .filter(([id, s]) => QUESTION_MAP[id] && s.attempts - s.correct > 0)
    .sort((a, b) => (b[1].attempts - b[1].correct) - (a[1].attempts - a[1].correct) || pct(a[1].correct, a[1].attempts) - pct(b[1].correct, b[1].attempts))
    .slice(0, 5);

  return `
  <div class="grid gap-5 lg:grid-cols-3">
    <div class="space-y-5 lg:col-span-2">
      <section class="card card-pad">${filterBar(true)}</section>
      ${body}
    </div>
    <aside class="space-y-5">
      <section class="card card-pad">
        <h3 class="section-title">Seu desempenho</h3>
        <div class="mt-4 grid grid-cols-3 gap-2 text-center">
          <div class="rounded-xl bg-slate-50 p-3"><div class="text-xl font-bold text-navy-900">${totals.answered}</div><div class="text-[11px] text-slate-500">respostas</div></div>
          <div class="rounded-xl bg-emerald-50 p-3"><div class="text-xl font-bold text-emerald-700">${totals.correct}</div><div class="text-[11px] text-slate-500">acertos</div></div>
          <div class="rounded-xl bg-gold-50 p-3"><div class="text-xl font-bold text-gold-700">${totals.answered ? totals.acc + '%' : '—'}</div><div class="text-[11px] text-slate-500">taxa</div></div>
        </div>
        <div class="mt-3 text-xs text-slate-500">${totals.unique} de ${QUESTIONS.length} questões já resolvidas</div>
        <div class="mt-5 space-y-3">
          ${SUBJECT_KEYS.map(k => { const t = questionTotals(qq => qq.s === k); return `
            <div>
              <div class="flex justify-between text-sm"><span class="font-medium text-slate-700">${SUBJECTS[k].name}</span><span class="text-xs text-slate-500">${t.correct}/${t.answered} · ${t.answered ? t.acc + '%' : '—'}</span></div>
              <div class="mt-1">${progressBar(t.acc, SUBJECTS[k].color, '!h-1.5')}</div>
            </div>`; }).join('')}
        </div>
        <div class="mt-5 grid grid-cols-3 gap-2 text-center">
          ${[1, 2, 3].map(d => { const t = questionTotals(qq => qq.d === d); return `<div class="rounded-lg border border-slate-100 p-2"><div class="text-[11px] font-semibold ${DIFFICULTY[d].cls} rounded px-1">${DIFFICULTY[d].label}</div><div class="mt-1 text-sm font-bold text-navy-900">${t.answered ? t.acc + '%' : '—'}</div></div>`; }).join('')}

        <h3 class="section-title">Para revisar</h3>
        <p class="text-xs text-slate-500">Questões que você mais errou</p>
        <ul class="mt-3 space-y-2">
          ${hardest.length ? hardest.map(([id, s]) => { const qq = QUESTION_MAP[id]; return `
            <li><button data-action="q-jump" data-id="${id}" class="flex w-full items-center gap-3 rounded-xl border border-slate-100 p-2.5 text-left hover:bg-slate-50">
              <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-xs" style="background:${SUBJECTS[qq.s].color}14;color:${SUBJECTS[qq.s].color}"><i class="fa-solid ${SUBJECTS[qq.s].icon}"></i></span>
              <span class="min-w-0 flex-1 truncate text-sm text-slate-700">${esc(qq.q.split('\n')[0])}</span>
              <span class="text-xs font-semibold text-rose-600">${s.attempts - s.correct}✗</span>
            </button></li>`; }).join('') : '<li class="text-sm text-slate-500">Nenhum erro registrado ainda. 👏</li>'}
        </ul>
        ${totals.answered ? '<button data-action="q-reset-stats" class="mt-4 text-xs font-semibold text-rose-600 hover:underline"><i class="fa-solid fa-trash-can mr-1"></i>Zerar estatísticas de questões</button>' : ''}
      </section>
    </aside>
  </div>`;
}

function viewSimulado() {
  const sim = QV.sim;

  // ----- Tela inicial / configuração -----
  if (!sim) {
    const history = S.simulados.slice().reverse().slice(0, 10);
    const available = QUESTIONS.filter(q => (QV.filters.subject === 'all' || q.s === QV.filters.subject) && (QV.filters.diff === 'all' || String(q.d) === QV.filters.diff)).length;
    return `
    <div class="grid gap-5 lg:grid-cols-3">
      <section class="card card-pad lg:col-span-2">
        <h3 class="section-title">Novo simulado</h3>
        <p class="mt-1 text-sm text-slate-500">Questões sorteadas, sem gabarito durante a prova. A correção completa aparece ao final.</p>
        <div class="mt-5">${filterBar(false)}</div>
        <div class="mt-4">
          <label class="label">Quantidade de questões</label>
          <div class="flex flex-wrap gap-2">
            ${[5, 10, 15, 20].map(n => `<button data-action="sim-start" data-n="${n}" class="btn-ghost" ${available === 0 ? 'disabled' : ''}>${Math.min(n, available)} questões</button>`).join('')}
          </div>
          <p class="mt-3 text-xs text-slate-500">${available} questões disponíveis com esses filtros.</p>
        </div>
      </section>
      <section class="card card-pad">
        <h3 class="section-title">Histórico</h3>
        <ul class="mt-3 space-y-2">
          ${history.length ? history.map(h => { const p = pct(h.correct, h.total); return `
            <li class="flex items-center justify-between rounded-xl border border-slate-100 p-3">
              <div>
                <div class="text-sm font-semibold text-navy-900">${h.subject === 'all' ? 'Geral' : (SUBJECTS[h.subject] || {}).name || h.subject}${h.diff !== 'all' ? ` · ${(DIFFICULTY[h.diff] || {}).label || ''}` : ''}</div>
                <div class="text-xs text-slate-500">${new Date(h.date).toLocaleDateString('pt-BR')} · ${fmtClock(h.durationSec)}</div>
              </div>
              <div class="text-right"><div class="text-lg font-bold ${p >= 70 ? 'text-emerald-600' : p >= 50 ? 'text-amber-600' : 'text-rose-600'}">${p}%</div><div class="text-xs text-slate-500">${h.correct}/${h.total}</div></div>
            </li>`; }).join('') : '<li class="text-sm text-slate-500">Nenhum simulado realizado ainda.</li>'}
        </ul>
      </section>
    </div>`;
  }

  // ----- Resultado -----
  if (sim.finished) {
    const r = sim.result;
    const p = pct(r.correct, r.total);
    return `
    <section class="card overflow-hidden">
      <div class="bg-navy-900 p-6 text-white wave-bg">
        <div class="text-[11px] font-semibold uppercase tracking-[.2em] text-gold-300">Resultado do simulado</div>
        <div class="mt-2 flex flex-wrap items-end gap-4">
          <div class="font-display text-6xl font-bold text-gold-400">${p}%</div>
          <div class="pb-2 text-navy-100">${r.correct} acertos de ${r.total} · tempo ${fmtClock(r.durationSec)}</div>
        </div>
        <p class="mt-2 text-sm text-navy-100/80">${p >= 80 ? 'Excelente! Desempenho de aprovação.' : p >= 60 ? 'Bom resultado. Revise os erros e mantenha o ritmo.' : 'Foque na revisão das resoluções abaixo. Constância vence.'}</p>
        <div class="mt-4 flex flex-wrap gap-2">
          <button data-action="sim-new" class="btn-gold"><i class="fa-solid fa-rotate"></i>Novo simulado</button>
        </div>
      </div>
      <div class="divide-y divide-slate-100">
        ${sim.ids.map((id, i) => { const q = QUESTION_MAP[id]; const ans = sim.answers[id]; const ok = ans === q.a; return `
          <details class="group p-5 sm:p-6">
            <summary class="flex items-start gap-3">
              <span class="grid h-7 w-7 shrink-0 place-items-center rounded-full text-xs font-bold text-white ${ans === undefined ? 'bg-slate-400' : ok ? 'bg-emerald-500' : 'bg-rose-500'}">${i + 1}</span>
              <span class="flex-1 text-sm text-slate-700">${esc(q.q.split('\n')[0])}</span>
              <span class="text-xs font-semibold ${ans === undefined ? 'text-slate-500' : ok ? 'text-emerald-600' : 'text-rose-600'}">${ans === undefined ? 'Em branco' : ok ? 'Acertou' : `Marcou ${'ABCDE'[ans]}`}</span>
              <i class="fa-solid fa-chevron-down mt-0.5 text-xs text-slate-400 transition group-open:rotate-180"></i>
            </summary>
            <div class="mt-4 space-y-4 pl-0 sm:pl-10">
              ${questionHeader(q)}
              <p class="q-text text-sm text-slate-800">${esc(q.q)}</p>
              <div class="space-y-2">${alternativesHTML(q, ans, true, 'noop')}</div>
              <div class="rounded-xl bg-navy-50 p-4"><div class="text-xs font-bold uppercase tracking-wide text-navy-700">Resolução</div><p class="q-text mt-2 text-sm text-navy-900">${esc(q.exp)}</p></div>
            </div>
          </details>`; }).join('')}
      </div>
    </section>`;
  }

  // ----- Em andamento -----
  const q = QUESTION_MAP[sim.ids[sim.idx]];
  const answeredCount = Object.keys(sim.answers).length;
  return `
  <div class="grid gap-5 lg:grid-cols-3">
    <section class="card card-pad lg:col-span-2">
      <div class="flex flex-wrap items-center justify-between gap-2">
        ${questionHeader(q)}
        <span class="text-sm font-semibold text-slate-500">${sim.idx + 1} / ${sim.ids.length}</span>
      </div>
      <p class="q-text mt-5 text-base leading-relaxed text-slate-800 sm:text-[17px]">${esc(q.q)}</p>
      <div class="mt-5 space-y-2.5">${alternativesHTML(q, sim.answers[q.id], false, 'sim-answer')}</div>
      <div class="mt-5 flex justify-between gap-2 border-t border-slate-100 pt-4">
        <button data-action="sim-prev" class="btn-ghost" ${sim.idx === 0 ? 'disabled' : ''}><i class="fa-solid fa-arrow-left"></i>Anterior</button>
        ${sim.idx < sim.ids.length - 1
          ? '<button data-action="sim-next" class="btn-primary">Próxima<i class="fa-solid fa-arrow-right"></i></button>'
          : '<button data-action="sim-finish" class="btn-gold"><i class="fa-solid fa-flag-checkered"></i>Finalizar</button>'}
      </div>
    </section>
    <aside class="card card-pad h-fit">
      <h3 class="section-title">Cartão-resposta</h3>
      <p class="text-xs text-slate-500">${answeredCount} de ${sim.ids.length} respondidas</p>
      <div class="mt-4 grid grid-cols-5 gap-2">
        ${sim.ids.map((id, i) => `<button data-action="sim-goto" data-i="${i}" class="h-10 rounded-lg text-sm font-semibold ${i === sim.idx ? 'ring-2 ring-gold-500' : ''} ${sim.answers[id] !== undefined ? 'bg-navy-900 text-white' : 'bg-slate-100 text-slate-600'}">${i + 1}${sim.answers[id] !== undefined ? `<span class="text-[10px] text-gold-300">${'ABCDE'[sim.answers[id]]}</span>` : ''}</button>`).join('')}
      </div>
      <button data-action="sim-finish" class="btn-gold mt-5 w-full"><i class="fa-solid fa-flag-checkered"></i>Finalizar simulado</button>
      <button data-action="sim-cancel" class="btn-ghost mt-2 w-full">Cancelar</button>
    </aside>
  </div>`;
}

function recordAnswer(qid, chosen) {
  const q = QUESTION_MAP[qid];
  const st = S.questionStats[qid] || (S.questionStats[qid] = { attempts: 0, correct: 0, last: null, lastCorrect: null, ts: 0 });
  const ok = chosen === q.a;
  st.attempts++; if (ok) st.correct++;
  st.last = chosen; st.lastCorrect = ok; st.ts = Date.now();
  return ok;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

  let weekMin = 0, doneMin = 0;

      <div>
        <h3 class="section-title">Plano de Estudos Semanal</h3>
        <p class="text-sm text-slate-500">Distribua as matérias e metas de cada dia. Marque o que foi cumprido.</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button data-action="plan-template" class="btn-ghost"><i class="fa-solid fa-wand-magic-sparkles"></i>Modelo sugerido</button>
        <button data-action="plan-new-week" class="btn-ghost"><i class="fa-solid fa-rotate"></i>Nova semana</button>
      </div>
    </div>
    <div class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">

      <div class="rounded-xl bg-emerald-50 p-4"><div class="text-xs font-semibold uppercase text-emerald-700">Cumprido</div><div class="mt-1 text-2xl font-bold text-emerald-800">${pct(doneMin, weekMin)}%</div></div>
      <div class="rounded-xl border border-slate-100 p-4 sm:col-span-2">
        <div class="text-xs font-semibold uppercase text-slate-500">Distribuição por matéria</div>
        <div class="mt-2 flex h-3 overflow-hidden rounded-full bg-slate-100">
          ${weekMin ? SUBJECT_KEYS.map(k => minBySubj[k] ? `<span title="${SUBJECTS[k].name}: ${fmtDuration(minBySubj[k] * 60)}" style="width:${(minBySubj[k] / weekMin) * 100}%;background:${SUBJECTS[k].color}"></span>` : '').join('') : ''}
        </div>
        <div class="mt-2 flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-slate-500">

      </div>

  <div class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4">
    ${DAYS.map(({ k, n }) => {
      const items = S.plan[k];

      const isToday = k === today;
      return `
      <section class="card flex flex-col ${isToday ? 'ring-2 ring-gold-500' : ''}">
        <div class="flex items-center justify-between rounded-t-2xl px-4 py-3 ${isToday ? 'bg-navy-900 text-white' : 'border-b border-slate-100'}">
          <div>
            <div class="font-display text-base font-semibold uppercase tracking-wide">${n}${isToday ? ' <span class="ml-1 rounded bg-gold-500 px-1.5 py-0.5 font-sans text-[10px] font-bold text-navy-950">HOJE</span>' : ''}</div>
            <div class="text-xs ${isToday ? 'text-navy-100/80' : 'text-slate-500'}">${fmtDuration(total * 60)} · ${done}/${items.length} metas</div>
          </div>
          ${items.length ? `<div class="text-sm font-bold ${isToday ? 'text-gold-300' : 'text-slate-500'}">${pct(done, items.length)}%</div>` : ''}
        </div>
        <ul class="flex-1 space-y-2 p-3">
          ${items.length ? items.map(it => planItemHTML(k, it)).join('') : '<li class="py-3 text-center text-xs text-slate-400">Dia livre / descanso</li>'}
        </ul>
        <form data-submit="plan-add" data-day="${k}" class="space-y-2 border-t border-slate-100 p-3">
          <div class="flex gap-2">
            <select name="subject" class="input !py-2 flex-1" aria-label="Matéria">
              ${SUBJECT_KEYS.map(s => `<option value="${s}">${SUBJECTS[s].name}</option>`).join('')}
            </select>
            <input name="minutes" type="number" min="5" max="720" step="5" value="60" class="input !py-2 w-20" aria-label="Minutos" />
          </div>
          <div class="flex gap-2">
            <input name="goal" type="text" maxlength="140" placeholder="Meta (ex.: 20 questões de derivadas)" class="input !py-2 flex-1" />
            <button type="submit" class="btn-primary !px-3 !py-2" aria-label="Adicionar"><i class="fa-solid fa-plus"></i></button>
          </div>
        </form>
      </section>`; }).join('')}
  </div>`;
}

const PLAN_TEMPLATE = {
  seg: [['mat', 'Teoria: funções e logaritmos + 15 questões', 120], ['ing', 'Reading: 2 textos + vocabulário', 60]],
  ter: [['fis', 'Cinemática e lançamentos + 15 questões', 120], ['por', 'Sintaxe do período simples', 60]],
  qua: [['mat', 'Trigonometria + lista de exercícios', 120], ['red', 'Leitura de repertório + esboço', 60]],
  qui: [['fis', 'Dinâmica: leis de Newton + 20 questões', 120], ['ing', 'Verb tenses e conditionals', 60]],
  sex: [['mat', 'Cálculo: limites e derivadas', 120], ['por', 'Concordância, regência e crase', 60]],
  sab: [['red', 'Redação completa cronometrada', 90], ['mat', 'Simulado misto + correção', 120], ['fis', 'Revisão da semana', 60]],

};

/* =====================================================================
   7. MODAIS, TOASTS E EVENTOS
   ===================================================================== */

function toast(html, type = 'info', ms = 3200) {
  const root = document.getElementById('toast-root');
  if (!root) return;
  const styles = {
    info: 'bg-navy-900 text-white', success: 'bg-emerald-600 text-white',
    error: 'bg-rose-600 text-white', gold: 'bg-gold-500 text-navy-950'
  };
  const el = document.createElement('div');
  el.className = `toast-in pointer-events-auto max-w-md rounded-xl px-4 py-3 text-sm font-medium shadow-lg ${styles[type] || styles.info}`;
  el.innerHTML = html;
  root.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, ms);
}

function openModal(title, bodyHTML, { icon = 'fa-anchor', wide = false } = {}) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="fixed inset-0 z-50 flex items-end justify-center bg-navy-950/60 p-0 backdrop-blur-sm sm:items-center sm:p-4" data-action="modal-backdrop">
    <div class="fade-in max-h-[92vh] w-full ${wide ? 'sm:max-w-2xl' : 'sm:max-w-md'} overflow-y-auto rounded-t-2xl bg-white shadow-2xl sm:rounded-2xl" role="dialog" aria-modal="true">
      <div class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-100 bg-white px-5 py-4">
        <h3 class="font-display text-lg font-semibold uppercase tracking-wide text-navy-900"><i class="fa-solid ${icon} mr-2 text-gold-500"></i>${title}</h3>
        <button data-action="modal-close" class="grid h-9 w-9 place-items-center rounded-lg text-slate-400 hover:bg-slate-100" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-5">${bodyHTML}</div>
    </div>
  </div>`;
  const first = root.querySelector('input, select');
  if (first) setTimeout(() => first.focus(), 50);
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

function openManualModal() {
  openModal('Lançar tempo', `
    <form data-submit="manual-time" class="space-y-4">
      <div><label class="label">Matéria</label><select name="subject" class="input">${SUBJECT_KEYS.map(k => `<option value="${k}" ${S.timer.subject === k ? 'selected' : ''}>${SUBJECTS[k].name}</option>`).join('')}</select></div>
      <div><label class="label">Minutos estudados (hoje)</label><input name="minutes" type="number" min="1" max="720" value="30" required class="input" /></div>

function exportData() {
  try {
    saveNow();
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `logic-academy-backup-${dateKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Backup exportado.', 'success');
  } catch (e) { console.error(e); toast('Falha ao exportar backup.', 'error'); }
}

function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!isObj(parsed) || !('studyLog' in parsed || 'edital' in parsed || 'plan' in parsed)) throw new Error('Arquivo não reconhecido');
      if (!confirm('Importar este backup vai substituir os dados atuais. Continuar?')) return;
      S = sanitizeState(parsed);
      S.timer.running = false;
      pendingStudyMs = 0;
      saveNow(); closeModal(); lastRankIdx = getRank(computeXP()).idx; buildQuestionList(); render();
      toast('Backup importado com sucesso.', 'success');
    } catch (e) { console.error(e); toast('Arquivo de backup inválido.', 'error'); }
  };
  reader.onerror = () => toast('Não foi possível ler o arquivo.', 'error');
  reader.readAsText(file);
}

/* ---------- Ações (delegação de eventos via data-action) ---------- */
const ACTIONS = {
  go: el => { currentView = el.dataset.view; window.scrollTo({ top: 0 }); render(); },
  'go-edital': el => { editalTab = el.dataset.subject; currentView = 'edital'; window.scrollTo({ top: 0 }); render(); },
  'open-settings': openSettingsModal,
  'open-ranks': openRanksModal,
  'edit-exam-date': openExamDateModal,
  'modal-close': closeModal,
  'modal-backdrop': (el, e) => { if (e.target === el) closeModal(); },
  noop: () => {},

  // Cronômetro
  'timer-toggle': () => (S.timer.running ? timerPause() : timerStart()),
  'timer-reset': timerReset,
  'timer-skip': timerSkip,
  'timer-mode': el => setTimerMode(el.dataset.mode),
  'toggle-sound': () => { S.settings.sound = !S.settings.sound; saveSoon(); if (S.settings.sound) Sound.play('click'); render(); },
  'test-sound': () => Sound.play('focusEnd', true),
  'add-manual': openManualModal,

  // Edital
  'edital-tab': el => { editalTab = el.dataset.subject; render(); },
  'edital-toggle': el => {
    const { id, field } = el.dataset;
    const e = S.edital[id] || (S.edital[id] = {});
    e[field] = !e[field];
    saveSoon(); checkPromotion(); render();
  },
  'edital-all': el => {
    const id = el.dataset.id;
    const e = S.edital[id] || (S.edital[id] = {});
    const all = STATUS_FIELDS.every(f => e[f.key]);
    STATUS_FIELDS.forEach(f => { e[f.key] = !all; });
    saveSoon(); checkPromotion(); render();
  },

  // Questões — treino
  'q-mode': el => { QV.mode = el.dataset.mode; render(); },
  'q-answer': el => {
    if (QV.revealed) return;
    const qid = QV.list[QV.idx];
    QV.selected = Number(el.dataset.opt); QV.revealed = true;
    const ok = recordAnswer(qid, QV.selected);
    Sound.play('click');
    saveSoon(); checkPromotion(); render();
    if (!ok) navigator.vibrate?.(80);
  },
  'q-next': () => { if (QV.idx < QV.list.length - 1) { QV.idx++; QV.selected = null; QV.revealed = false; render(); } },
  'q-skip': () => ACTIONS['q-next'](),
  'q-prev': () => { if (QV.idx > 0) { QV.idx--; QV.selected = null; QV.revealed = false; render(); } },
  'q-random': () => {
    if (QV.list.length < 2) return;
    let n; do { n = Math.floor(Math.random() * QV.list.length); } while (n === QV.idx);
    QV.idx = n; QV.selected = null; QV.revealed = false; render();
  },
  'q-jump': el => {
    QV.filters = { subject: 'all', diff: 'all', status: 'all' };
    buildQuestionList();
    QV.idx = Math.max(0, QV.list.indexOf(el.dataset.id));
    render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  'q-reset-stats': () => {
    if (!confirm('Zerar todas as estatísticas de questões? (simulados e horas são mantidos)')) return;
    S.questionStats = {}; saveNow(); lastRankIdx = getRank(computeXP()).idx; buildQuestionList(); render();
  },

  // Questões — simulado
  'sim-start': el => {
    const n = Number(el.dataset.n);
    const pool = QUESTIONS.filter(q => (QV.filters.subject === 'all' || q.s === QV.filters.subject) && (QV.filters.diff === 'all' || String(q.d) === QV.filters.diff));
    if (!pool.length) return;
    QV.sim = { ids: shuffle(pool).slice(0, n).map(q => q.id), answers: {}, idx: 0, startedAt: Date.now(), finished: false, subject: QV.filters.subject, diff: QV.filters.diff };
    render();
  },
  'sim-answer': el => { const sim = QV.sim; sim.answers[sim.ids[sim.idx]] = Number(el.dataset.opt); render(); },
  'sim-next': () => { QV.sim.idx = Math.min(QV.sim.ids.length - 1, QV.sim.idx + 1); render(); },
  'sim-prev': () => { QV.sim.idx = Math.max(0, QV.sim.idx - 1); render(); },
  'sim-goto': el => { QV.sim.idx = Number(el.dataset.i); render(); },
  'sim-cancel': () => { if (confirm('Cancelar o simulado? As respostas serão descartadas.')) { QV.sim = null; render(); } },
  'sim-new': () => { QV.sim = null; render(); },
  'sim-finish': () => {
    const sim = QV.sim;
    const blank = sim.ids.length - Object.keys(sim.answers).length;
    if (blank > 0 && !confirm(`Há ${blank} questão(ões) em branco. Finalizar mesmo assim?`)) return;
    let correct = 0;
    sim.ids.forEach(id => { if (sim.answers[id] !== undefined && recordAnswer(id, sim.answers[id])) correct++; });
    const durationSec = Math.round((Date.now() - sim.startedAt) / 1000);
    sim.result = { total: sim.ids.length, correct, durationSec };
    sim.finished = true;
    S.simulados.push({ date: Date.now(), total: sim.ids.length, correct, subject: sim.subject, diff: sim.diff, durationSec });
    if (S.simulados.length > 200) S.simulados = S.simulados.slice(-200);
    saveNow(); Sound.play('breakEnd'); checkPromotion(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  },

  // Plano
  'plan-toggle': el => {
    const it = (S.plan[el.dataset.day] || []).find(i => i.id === el.dataset.id);
    if (it) { it.done = !it.done; saveSoon(); render(); }
  },
  'plan-del': el => {
    S.plan[el.dataset.day] = S.plan[el.dataset.day].filter(i => i.id !== el.dataset.id);
    saveSoon(); render();
  },
  'plan-new-week': () => {
    if (!confirm('Desmarcar todas as metas concluídas para começar uma nova semana?')) return;
    DAYS.forEach(({ k }) => S.plan[k].forEach(i => { i.done = false; }));
    saveNow(); render(); toast('Nova semana iniciada. Rumo à aprovação!', 'success');
  },
  'plan-template': () => {
    const hasItems = DAYS.some(({ k }) => S.plan[k].length);
    if (hasItems && !confirm('Substituir o plano atual pelo modelo sugerido?')) return;
    DAYS.forEach(({ k }) => { S.plan[k] = (PLAN_TEMPLATE[k] || []).map(([subject, goal, minutes]) => ({ id: uid(), subject, goal, minutes, done: false })); });
    saveNow(); render(); toast('Modelo de plano aplicado. Ajuste à sua rotina!', 'success');
  },

  // Configurações
  export: exportData,
  'reset-all': () => {
    if (!confirm('Apagar TODOS os dados (horas, edital, questões, plano)? Esta ação não pode ser desfeita.')) return;
    if (!confirm('Tem certeza? Recomenda-se exportar um backup antes.')) return;
    Store.clear(); S = createDefaultState(); pendingStudyMs = 0; lastRankIdx = 0; saveNow();
    QV.sim = null; buildQuestionList(); closeModal(); render(); toast('Dados apagados.', 'info');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  try { fn(el, e); } catch (err) { console.error('[action]', el.dataset.action, err); toast('Ocorreu um erro. Seus dados estão preservados.', 'error'); }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  try {
    switch (el.dataset.change) {
      case 'timer-subject': timerSetSubject(el.value); render(); break;
      case 'q-filter':
        QV.filters[el.dataset.key] = el.value;
        if (QV.mode === 'treino') buildQuestionList();
        render(); break;
      case 'import': importData(el.files && el.files[0]); el.value = ''; break;
    }
  } catch (err) { console.error(err); toast('Ocorreu um erro.', 'error'); }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('[data-submit]');
  if (!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  try {
    switch (form.dataset.submit) {
      case 'exam-date': {
        const v = String(fd.get('date') || '');
        if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast('Data inválida.', 'error'); return; }
        S.examDate = v; saveNow(); closeModal(); render(); toast('Data da prova atualizada.', 'success');
        break;
      }
      case 'settings': {
        const v = String(fd.get('examDate') || '');
        if (/^\d{4}-\d{2}-\d{2}$/.test(v)) S.examDate = v;
        S.settings.dailyGoalMin = Math.round(num(parseFloat(fd.get('goal')), 4, 0.25, 16) * 60);
        const oldDur = { ...S.settings.durations };
        S.settings.durations.focus = Math.round(num(parseFloat(fd.get('focus')), 25, 1, 180));
        S.settings.durations.short = Math.round(num(parseFloat(fd.get('short')), 5, 1, 60));
        S.settings.durations.long = Math.round(num(parseFloat(fd.get('long')), 15, 1, 90));
        S.settings.sound = fd.get('sound') === 'on';
        S.settings.autoStart = fd.get('autoStart') === 'on';
        // Se o ciclo atual está parado, aplica a nova duração
        const m = S.timer.mode;
        if (m !== 'free' && !S.timer.running && oldDur[m] !== S.settings.durations[m]) S.timer.remaining = modeDuration(m);
        saveNow(); closeModal(); render(); toast('Configurações salvas.', 'success');
        break;
      }
      case 'manual-time': {
        const subj = SUBJECTS[fd.get('subject')] ? fd.get('subject') : 'mat';
        const mins = Math.round(num(parseFloat(fd.get('minutes')), 0, 1, 720));
        if (!mins) return;
        addStudy(mins * 60, subj); saveNow(); closeModal(); checkPromotion(); render();
        toast(`${mins} min de ${SUBJECTS[subj].name} lançados.`, 'success');
        break;
      }
      case 'plan-add': {
        const day = form.dataset.day;
        const subject = SUBJECTS[fd.get('subject')] ? fd.get('subject') : 'mat';
        const minutes = Math.round(num(parseFloat(fd.get('minutes')), 60, 5, 720));
        const goal = String(fd.get('goal') || '').trim().slice(0, 140);
        S.plan[day].push({ id: uid(), subject, goal, minutes, done: false });
        saveSoon(); render();
        break;
      }
    }
  } catch (err) { console.error(err); toast('Não foi possível salvar.', 'error'); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  // Atalho: espaço inicia/pausa o cronômetro na tela dele
  if (e.code === 'Space' && currentView === 'timer' && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName) && !document.getElementById('modal-root').innerHTML) {
    e.preventDefault(); S.timer.running ? timerPause() : timerStart();
  }
});

/* Garante a gravação ao sair/ocultar a aba */
window.addEventListener('pagehide', () => { timerTick(); saveNow(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { timerTick(); saveNow(); } else { timerTick(); } });

/* Sincroniza entre abas abertas (se não houver cronômetro rodando aqui) */
window.addEventListener('storage', e => {
  if (e.key !== STORAGE_KEY || !e.newValue || S.timer.running) return;
  try { S = sanitizeState(JSON.parse(e.newValue)); render(); } catch (_) { /* ignora */ }
});

/* ---------- Inicialização ---------- */
(function init() {
  if (!Store.available) document.getElementById('storage-warning').classList.remove('hidden');
  if (loaded.source === 'backup') setTimeout(() => toast('Os dados principais estavam corrompidos — restauramos a última cópia de segurança.', 'gold', 6000), 400);
  if (loaded.source === 'corrupt') setTimeout(() => toast('Não foi possível ler os dados salvos. Iniciamos um perfil novo.', 'error', 6000), 400);

  buildQuestionList();
  // Retoma o cronômetro se estava rodando (credita o tempo decorrido)
  if (S.timer.running) {
    timerTick();
    if (S.timer.running) setTimeout(() => toast(`Cronômetro retomado: ${TIMER_MODES[S.timer.mode].label}.`, 'info'), 300);
  }
  saveNow();
  render();
  setInterval(timerTick, 250);
})();
</script>
